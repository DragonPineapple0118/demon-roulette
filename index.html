const C={ver:'v3',lv:[{L:2,B:3,hp:2,hc:1},{L:3,B:3,hp:2,hc:2},{L:4,B:4,hp:2,hc:3}],a:10,b:5,d:5,bonus:10,T:10,G:300,
 /* 表情設定：eyes=眼眶編號, ball=眼珠檔名(閉眼不用寫), mouth=嘴巴編號, blush=腮紅編號(不要就不寫)；陣列依序是第 1、2、3 關
    規則：腮紅 2 只搭嘴巴 3；嘴巴 4 配腮紅 1；嘴巴 4、5、6、8 只在第 3 關用。 */
 faces:{idle:[{eyes:1,mouth:1,blush:1},{eyes:2,ball:'eyeballs_for_eyes2',mouth:2,blush:1},{eyes:3,ball:'eyeballs2',mouth:3,blush:2}],
  aimed:{eyes:2,ball:'eyeballs_for_eyes2',mouth:1,blush:1},
  act:[{eyes:2,ball:'eyeballs_for_eyes2'},{eyes:2,ball:'eyeballs_for_eyes2'},{eyes:3,ball:'eyeballs2'}],
  take:[{mouth:1,blush:1},{mouth:2,blush:1},{mouth:4,blush:1}],point:[{mouth:1,blush:1},{mouth:2,blush:1},{mouth:5}],
  miss:[{mouth:1,blush:1},{mouth:1,blush:1},{mouth:6}],hit:{mouth:3,blush:2},nerv:{mouth:8}},
 url:'https://script.google.com/macros/s/AKfycbwtUO9UlfroJeq1jPKIuQlq-VQA2U7rcf96bsvwM01HH6tud0TCCeLQHzYzHHi_xkoZ/exec' /* 把 Apps Script 網頁應用程式網址貼在這裡 */};
const COLS=['ts','gid','pid','seq','ver','src','type','level','shot_no','live_left','blank_left','hp','hc','score_before','actor','action','result','score_after','dec_time','timeout','end_reason','final_score','levels_cleared','total_time','diff','replay','fun','device','name','risk','params'];
/* ---- 可調參數：每局開始時從試算表的 config 分頁讀取；讀不到或不合格就用這裡的內建預設 ---- */
const KEYS=['L1_live','L1_blank','L1_hp','L1_hc','L2_live','L2_blank','L2_hp','L2_hc','L3_live','L3_blank','L3_hp','L3_hc','a','b','d','bonus','T'];
const mk=v=>Object.fromEntries(KEYS.map((k,i)=>[k,v[i]]));
const DEF={low:mk([2,3,2,1, 3,3,2,2, 4,4,2,3, 10,5,5,10,10]),high:mk([2,3,1,1, 3,3,1,2, 4,4,1,3, 20,10,10,20,10])};
let CFG={low:DEF.low,high:DEF.high,src:{low:'default',high:'default'}},cfgP=Promise.resolve(),risk='',params='';
function valid(p){if(!p||!KEYS.every(k=>Number.isInteger(p[k])))return false;
 for(let i=1;i<=3;i++){const L=p['L'+i+'_live'],B=p['L'+i+'_blank'],hp=p['L'+i+'_hp'],hc=p['L'+i+'_hc'];
  if(L<1||B<1||hp<1||hc<1||hp>5||hc>5||L+B>12||L<hp+hc-1)return false}   /* 實彈數至少要是雙方生命和 −1，關卡才一定打得完 */
 return['a','b','d','bonus'].every(k=>p[k]>=0&&p[k]<=100)&&p.T>=3&&p.T<=30}
function loadCfg(){if(!C.url)return Promise.resolve();
 return fetch(C.url+'?t='+Date.now()).then(r=>r.json()).then(j=>{const o={src:{}};['low','high'].forEach(m=>{const ok=valid(j[m]);o[m]=ok?j[m]:DEF[m];o.src[m]=ok?'sheet':'default'});CFG=o}).catch(()=>{})}
function apply(m){const p=CFG[m];C.lv=[1,2,3].map(i=>({L:p['L'+i+'_live'],B:p['L'+i+'_blank'],hp:p['L'+i+'_hp'],hc:p['L'+i+'_hc']}));
 C.a=p.a;C.b=p.b;C.d=p.d;C.bonus=p.bonus;C.T=p.T;risk=m;params=CFG.src[m]+'|'+KEYS.map(k=>p[k]).join(',')}
const TH={A:{0:.1,15:.9},B:{0:.2,5:.1,15:.3,20:.1,25:.1,35:.1,45:.1}};
const $=q=>document.querySelector(q),app=$('#app');
const ls={get:k=>{try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}},set:(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
let name=ls.get('bk_name')||'';const esc=x=>String(x).replace(/[&<>"']/g,c=>'&#'+c.charCodeAt(0)+';');
let pid=ls.get('bk_pid');if(!pid){pid='P'+Math.random().toString(36).slice(2,8);ls.set('bk_pid',pid)}
/* ---- 遊戲引擎（模擬模式共用）---- */
const shuf=(n,l)=>{const a=Array.from({length:n},(_,i)=>i<l?1:0);for(let i=n-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const left=s=>{const r=s.sh.slice(s.i),l=r.reduce((x,y)=>x+y,0);return[l,r.length-l]};
const newLevel=(n,score)=>{const c=C.lv[n-1];return{n,sh:shuf(c.L+c.B,c.L),i:0,hp:c.hp,hc:c.hc,score}};
function shoot(s,act){const ev=[],take=()=>s.sh[s.i++];const x=take();
 if(act==='s'){if(x)s.hp--;else s.score+=C.a;ev.push({actor:'player',tgt:'self',x,sc:s.score})}
 else if(x){s.hc--;s.score+=C.b;ev.push({actor:'player',tgt:'computer',x,sc:s.score})}
 else{s.score=Math.max(0,s.score-C.d);ev.push({actor:'player',tgt:'computer',x,sc:s.score});
  if(s.i<s.sh.length){const r=take();if(r)s.hp--;ev.push({actor:'computer',tgt:'player',x:r,sc:s.score})}}
 return ev}
const state=s=>s.hp<=0?'dead':s.hc<=0?'clear':'';
const fin=s=>{const r=state(s);if(r==='clear')s.score+=C.bonus;return r};
const bot={A:()=>'c',B:s=>s.hp===2&&left(s)[1]>0?'s':'c'};
/* ---- 紀錄：每發即時存本機並分批送出 ---- */
let seq=0,gid='',busy=0;const all=ls.get('bk_all')||[];let out=ls.get('bk_out')||[];
function log(type,o){const r=Object.assign({ts:new Date().toISOString(),gid,pid,name,risk,params,seq:++seq,ver:C.ver,src:'human',type,device:/Mobi|Android|iPhone/.test(navigator.userAgent)?'phone':'pc'},o);all.push(r);out.push(r);ls.set('bk_all',all);ls.set('bk_out',out)}
function flush(beacon){if(!C.url||!out.length)return;const b=JSON.stringify(out),n=out.length;
 if(beacon&&navigator.sendBeacon){if(navigator.sendBeacon(C.url,new Blob([b],{type:'text/plain'}))){out=out.slice(n);ls.set('bk_out',out)}return}
 if(busy)return;busy=1;fetch(C.url,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain'},body:b}).then(()=>{out=out.slice(n);ls.set('bk_out',out)}).catch(()=>{}).finally(()=>{busy=0})}
setInterval(()=>flush(),3000);
document.addEventListener('visibilitychange',()=>{if(document.hidden)flush(true)});addEventListener('pagehide',()=>flush(true));
function csv(){const q=v=>{v=v==null?'':String(v);return/[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v};
 const t=[COLS.join(',')].concat(all.map(r=>COLS.map(c=>q(r[c])).join(','))).join('\n'),a=document.createElement('a');
 a.href=URL.createObjectURL(new Blob(['\ufeff'+t],{type:'text/csv'}));a.download='bk_'+pid+'.csv';a.click()}
/* ---- 畫面與流程 ---- */
let s,t0=0,tm=null,gno=ls.get('bk_n')||0,gt=0,shot=0,cleared=0;
function askName(){app.innerHTML=`<h1>實彈輪盤</h1><p>請輸入你的名字或暱稱，這台裝置只需要輸入一次。</p><label for=nm>名字</label><input id=nm maxlength=20 autocomplete=off><p id=ne role=alert></p><button class=main id=nok>確定</button>`;
 const go=()=>{const v=$('#nm').value.trim();if(!v){$('#ne').textContent='請先輸入名字。';return}name=v;ls.set('bk_name',v);home()};$('#nok').onclick=go;$('#nm').onkeydown=e=>{if(e.key==='Enter')go()};$('#nm').focus()}
function home(){if(!name)return askName();app.onclick=null;clearInterval(tm);showHome();cfgP=loadCfg().then(()=>{if($('#golow'))showHome()})}
function showHome(){const d=m=>{const p=CFG[m];return`我的生命 ${p.L1_hp}／${p.L2_hp}／${p.L3_hp}（三關）。射自己空彈 +${p.a}；射惡魔實彈 +${p.b}、空彈 −${p.d}；過關 +${p.bonus}。每發 ${p.T} 秒。`};
 app.innerHTML=`<h1>實彈輪盤</h1><p>共三關。每關彈匣隨機排列，畫面會顯示剩餘的實彈與空彈數。</p><p>射自己：空彈得分並繼續，實彈則生命 −1。射惡魔：實彈得分且惡魔生命 −1；空彈扣分，惡魔會朝你開一槍。</p><p>超時自動射惡魔；整局上限 ${C.G} 秒。你的生命歸零就結束，惡魔生命歸零就過關。</p>
 <h2>你想玩哪一種？</h2><div class=md><b>低風險</b><p>${d('low')}</p><button class=main id=golow>用低風險開始</button></div><div class=md><b>哪有賭狗天天輸</b><p>${d('high')}</p><button class=main id=gohigh>用高風險開始</button></div>
 <button id=ex>匯出 CSV</button><p>已玩 ${gno} 局，待同步 ${out.length} 筆。玩家：${esc(name)}（代號 ${pid}）。</p><p id=hs></p>`;
 $('#golow').onclick=()=>start('low');$('#gohigh').onclick=()=>start('high');$('#ex').onclick=csv}
async function start(m){$('#golow').disabled=$('#gohigh').disabled=true;$('#hs').textContent='載入設定中…';
 await Promise.race([cfgP,new Promise(r=>setTimeout(r,3000))]);apply(m);
 gno++;ls.set('bk_n',gno);gid=pid+'-'+gno;seq=0;gt=Date.now();cleared=0;s=null;log('game_start',{});lvl(1,0)}
function lvl(n,sc,ent){hitAt=s&&s.hp===1&&C.lv[s.n-1].hp>1?Date.now()-2400:-1e9;s=newLevel(n,sc);shot=0;const b=left(s);log('level_start',{level:n,live_left:b[0],blank_left:b[1],hp:s.hp,hc:s.hc,score_after:sc});if(ent){draw('',1,{ent:1});const st=$('.stage');setTimeout(()=>{if($('.stage')===st)draw('')},4400)}else draw('')}
const cls=f=>{const ps=f.aim==='self'||/^self/.test(f.a||''),pf=!ps&&(f.aim||f.a);return`${f.aim?'aim-'+f.aim:''} ${f.a?'a-'+f.a:''} ${f.r?'r-'+f.r:''} ${ps?'ps':pf?'pf':''} ${f.k?'kill':''} ${f.ent?'a-ent':''}`};
let hitAt=-1e9;
const im=(n,c)=>`<img class="dh ${c||''}" src="assets/${n}.png" alt="">`;
['back_hair','body','cape','face_1','face_2','face_3','blush1','blush2','eyebrows1','eyes1','eyes2','eyes3','eyeballs1','eyeballs2','eyeballs_for_eyes2','mouth1','mouth2','mouth3','mouth4','mouth5','mouth6','mouth8','table','gun_take','gun_aim','gun_self','demon_take','demon_shot','demon_hand1','demon_hand2','bg_pc','bg_phone','heart'].forEach(n=>{new Image().src='assets/'+n+'.png'});
function face(f){if(f.pf){const g=Object.assign({},f);delete g.pf;return`<div class="ph fpre">${f.pf}</div><div class="ph fpost">${face(g)}</div>`}
 const n=s.n,F=C.faces,[l,b]=left(s),act=F.act[n-1],ph=(c,h)=>h?`<div class="ph ${c}">${h}</div>`:'',
 eyes=(e,bl)=>(e.ball?im(e.ball,(bl?'eo ':'')+'eb'):'')+im('eyes'+e.eyes,bl?'eo':'')+(bl?im('eyes1','ec'):'');
 if(f.a==='clkd'){/* 對惡魔開空槍：惡魔反擊的三個階段，嘴巴依序換 */
  const sp=f.r?[F.take[n-1],F.point[n-1],f.r==='live'?F.hit:F.miss[n-1]]:[F.take[n-1]],c=i=>f.r?'p'+(i+1):'';
  return im('face_'+n)+sp.map((e,i)=>e.blush?ph(c(i),im('blush'+e.blush)):'').join('')+eyes(act,0)+im('eyebrows1')+sp.map((e,i)=>ph(c(i),im('mouth'+e.mouth))).join('')}
 const idle=!f.aim&&!f.a,nv=n===3&&s.hc===1&&b===0&&l>0&&f.a!=='selfl',
 e=f.a==='selfl'?Object.assign({},act,F.hit):nv?Object.assign({},F.idle[n-1],F.nerv,{blush:0}):f.aim==='dev'?F.aimed:F.idle[n-1],bl=idle&&e.ball;
 return im('face_'+n)+(e.blush?im('blush'+e.blush):'')+eyes(e,bl)+im('eyebrows1')+im('mouth'+e.mouth)}
const scene=(f,pl)=>`<div class=scene><div class=dvs aria-hidden="true"><div class=dv><img class=dh src="assets/back_hair.png" alt=""><img src="assets/body.png" alt=""><img src="assets/cape.png" alt="">${face(f)}</div></div><div class=dk></div><div class=tb><img src="assets/table.png" alt="">${pl}</div><div class=dhs aria-hidden="true"><img class="hh h1" src="assets/demon_take.png" alt=""><img class="hh h2" src="assets/demon_shot.png" alt=""><img class="pa pal" src="assets/demon_hand2.png" alt=""><img class="pa par" src="assets/demon_hand2.png" alt=""><img class="hnd hl" src="assets/demon_hand1.png" alt=""><img class="hnd hr" src="assets/demon_hand1.png" alt=""></div><div class=gw><div class=w1><img src="assets/gun_take.png" alt=""></div><div class=w2><img src="assets/gun_aim.png" alt=""></div><div class=w3><img src="assets/gun_self.png" alt=""></div></div></div>`;
const hearts=(n,m)=>Array.from({length:m},(_,i)=>`<img src="assets/heart.png" alt=""${i<n?'':' class=lost'}>`).join('');
function draw(msg,dis,fx){clearInterval(tm);let blood='';const[l,b]=left(s),f=fx||{},w=f.show||{},hurt=f.h0>s.hp,bd=hurt?(f.r?4:.1):0,
 pl=`<b class=n id=vb>${w.b??b}</b><b class=n id=vl>${w.l??l}</b><div class="hp hpd" role=img aria-label="惡魔生命 ${s.hc}">${hearts(s.hc,C.lv[s.n-1].hc)}</div><div class="hp hpm" id=vhp role=img aria-label="我的生命">${hearts(w.hp??s.hp,C.lv[s.n-1].hp)}</div><div class=inf><span>關卡 ${s.n}/3</span><span>分數 ${s.score}</span></div>`;
 if(hurt)hitAt=Date.now()+bd*1000;
 /* 中彈：一圈半透明血跡。剩 1 滴血時一直留著；否則約 6 秒內慢慢消散（跨畫面重繪也會接續） */
 if(s.hp===1&&C.lv[s.n-1].hp>1)blood=`<div class="blood stay" style="animation-delay:${hurt?bd:-1}s,${hurt?bd:0}s"></div>`;
 else if(s.hp>1&&Date.now()-hitAt<6000)blood=`<div class="blood fade" style="animation-delay:${(hitAt-Date.now())/1000}s"></div>`;
 app.innerHTML=`<div class="stage ${cls(f)}"><div class=world>${scene(f,pl)}<div class=top><div class=bar><span id=bar style="width:100%"></span></div><span id=tl>${dis?'':C.T+' 秒'}</span></div>${blood}<div id=msg>${msg}</div>${dis?'':'<div class=btns><button class=main id=bs>射自己</button><button id=bc>射惡魔</button></div>'}</div><div class=ov></div><div class=gl></div></div>`;
 if(dis)return;$('#bs').onclick=()=>act('s');$('#bc').onclick=()=>act('c');t0=Date.now();
 tm=setInterval(()=>{if(Date.now()-gt>=C.G*1000)return tmo();const r=Math.max(0,C.T-(Date.now()-t0)/1000);$('#tl').textContent=Math.ceil(r)+' 秒｜全局剩 '+Math.ceil(C.G-(Date.now()-gt)/1000)+' 秒';$('#bar').style.width=r/C.T*100+'%';if(r<=0)act('c',1)},100)}
function act(a,to){clearInterval(tm);const dt=Math.min(C.T,(Date.now()-t0)/1000);draw('瞄準中…',1,{aim:a==='s'?'self':'dev'});setTimeout(()=>fire(a,to,dt),1500)}
function fire(a,to,dt){const pre=a==='c'?face({aim:'dev'}):'',b=left(s),sb=s.score,hp=s.hp,hc=s.hc,ev=shoot(s,a),m=[];
 if(to)m.push('超時，自動射惡魔。');
 ev.forEach((e,j)=>{log('shot',{level:s.n,shot_no:++shot,live_left:b[0],blank_left:j?b[1]-1:b[1],hp,hc,score_before:j?ev[0].sc:sb,actor:e.actor,action:j?'retaliate':to?'timeout_computer':a==='s'?'self':'computer',result:e.x?'live':'blank',score_after:e.sc,dec_time:j?'':dt.toFixed(2),timeout:to?1:0});
  m.push(j?`惡魔反擊：${e.x?'實彈，你的生命 −1':'空彈'}。`:e.tgt==='self'?`對自己開槍：${e.x?'實彈，生命 −1':'空彈，+'+C.a+' 分'}。`:`對惡魔開槍：${e.x?'實彈，+'+C.b+' 分，惡魔生命 −1':'空彈，−'+C.d+' 分'}。`)});
 const r=fin(s),e0=ev[0],e1=ev[1],fx={a:e0.tgt==='self'?(e0.x?'selfl':'selfb'):(e0.x?'hitd':'clkd'),r:e1?(e1.x?'live':'blank'):'',h0:hp,k:r==='clear'},full=m.join('<br>');if(fx.a==='hitd')fx.pf=pre;
 /* 結果在開槍那一刻才揭曉：反擊前只顯示玩家這一發之後的狀態 */
 if(e1)fx.show={hp,l:b[0],b:b[1]-1};else if(fx.a==='selfl')fx.show={hp};
 draw(e1?m.slice(0,-1).concat('惡魔拿起了槍…').join('<br>'):full,1,fx);
 if(fx.show){const st=$('.stage');setTimeout(()=>{if($('.stage')!==st)return;const[l2,b2]=left(s);$('#vhp').innerHTML=hearts(s.hp,C.lv[s.n-1].hp);$('#vl').textContent=l2;$('#vb').textContent=b2;$('#msg').innerHTML=full},e1?(e1.x?3960:4050):60)}
 const gl=(q0,x,y,z,c)=>{const e=$(q0),g=$('.gl'),wd=$('.world');if(!e||!g||!wd)return;const q=e.getBoundingClientRect(),W=wd.getBoundingClientRect(),d=Math.min(W.width,W.height)*z,R=Math.random,n=9+Math.floor(R()*5),P=[],Q=[];let a=R()*6.28;
  for(let k=0;k<n*2;k++){const o=k%2===0,r=o?58+R()*42:20+R()*22;a+=6.2832/(n*2)*(.55+R()*.9);P.push((Math.cos(a)*r).toFixed(1)+','+(Math.sin(a)*r).toFixed(1));Q.push((Math.cos(a)*r*.5).toFixed(1)+','+(Math.sin(a)*r*.5).toFixed(1))}
  g.innerHTML=`<svg viewBox="-100 -100 200 200"><defs><radialGradient id=fg><stop offset=0 stop-color=#fff /><stop offset=.4 stop-color=#fff3c4 /><stop offset=.75 stop-color=#ffb04a stop-opacity=.85 /><stop offset=1 stop-color=#ff7a1a stop-opacity=0 /></radialGradient><filter id=fb x=-20% y=-20% width=140% height=140%><feGaussianBlur stdDeviation=2.2 /></filter></defs><polygon points="${P.join(' ')}" fill=url(#fg) filter=url(#fb) /><polygon points="${Q.join(' ')}" fill=#fff opacity=.92 filter=url(#fb) /></svg>`;
  g.style.cssText=`left:${q.left+q.width*x}px;top:${q.top+q.height*y}px;width:${d}px;height:${d}px;rotate:${Math.floor(R()*360)}deg`;g.classList.add(c)};
 if(fx.a==='selfl')gl('.w3 img',.53,.93,1,'go');if(fx.a==='hitd')gl('.w2 img',.19,.46,.3,'gd');if(fx.r==='live')setTimeout(()=>{const o=$('.ov');if(o)o.classList.add('on');gl('.dhs .h2',.415,.58,1,'go')},3900);setTimeout(()=>r?end(r):draw(''),r==='dead'?(fx.r?5000:1000):fx.a==='hitd'?(fx.k?500:4400):fx.r==='live'?6400:fx.r?5400:fx.a==='selfl'?2500:1300)}
function end(r){log('level_end',{level:s.n,end_reason:r,score_after:s.score,hp:s.hp,hc:s.hc});
 if(r==='dead')return over('dead');cleared++;if(s.n===3)return over('clear');
 const h=`<div class="fin clr"><div><h1>第 ${s.n} 關通過</h1><p>通關 +${C.bonus} 分，目前 ${s.score} 分。下一關生命會重設。</p><button class=main id=nx>進入第 ${s.n+1} 關</button></div></div>`,st=$('.stage');
 if(st)st.insertAdjacentHTML('beforeend',h);else app.innerHTML=h;$('#nx').onclick=()=>lvl(s.n+1,s.score,1)}
function tmo(){clearInterval(tm);log('level_end',{level:s.n,end_reason:'timeout',score_after:s.score,hp:s.hp,hc:s.hc});over('timeout')}
function over(r){const ti=r==='clear'?'全部通關':r==='timeout'?'時間到':'遊戲結束';
 log('game_end',{end_reason:r==='clear'?'clear_all':r==='timeout'?'timeout':'dead_L'+s.n,final_score:s.score,levels_cleared:cleared,total_time:Math.round((Date.now()-gt)/1000)});flush();
 app.innerHTML=`<div class="fin ${r==='dead'?'slow':''}"><div><h1>${ti}</h1><p>最終分數 ${s.score}，通過 ${cleared} 關。</p><button class=main id=ok>回到首頁</button></div></div>`;$('#ok').onclick=home}
/* ---- 模擬模式：網址加 ?sim=A 或 ?sim=B（可加 &n=20000）---- */
function simPage(k){const n=+(/n=(\d+)/.exec(location.search)||[0,20000])[1],o={c:[0,0,0],tot:0,all:0,p1:{}};
 for(let g=0;g<n;g++){let sc=0,lv=0;for(let m=1;m<=3;m++){const x=newLevel(m,sc);while(!state(x))shoot(x,bot[k](x));const r=fin(x);sc=x.score;if(m===1)o.p1[sc]=(o.p1[sc]||0)+1;if(r!=='clear')break;o.c[m-1]++;lv++}o.tot+=sc;if(lv===3)o.all++}
 const th=TH[k],xs=[...new Set(Object.keys(o.p1).concat(Object.keys(th)))].sort((a,b)=>a-b);
 app.innerHTML=`<h1>模擬：策略 ${k}</h1><p>${n} 局，資料來源為模擬，不會上傳。</p><p>第一關通關率 ${(o.c[0]/n).toFixed(3)}，連過兩關 ${(o.c[1]/n).toFixed(3)}，整局通關 ${(o.all/n).toFixed(3)}，平均總分 ${(o.tot/n).toFixed(2)}</p><table><tr><th>第一關得分</th><th>模擬</th><th>理論</th></tr>${xs.map(x=>`<tr><td>${x}</td><td>${((o.p1[x]||0)/n).toFixed(3)}</td><td>${(th[x]||0).toFixed(3)}</td></tr>`).join('')}</table>`}
const sm=/sim=([AB])/.exec(location.search);sm?simPage(sm[1]):home();
</script></body></html>
